name: Get SHA Fingerprints

on:
  workflow_dispatch:

jobs:
  get-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Gradle Signing Report
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport
